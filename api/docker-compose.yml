name: ${HOST_USERNAME}-ngrok-api-compose
services:
  ngrok-api:
    build:
      # context: .
      # dockerfile: Dockerfile
      context: ..
      dockerfile: api/Dockerfile
      args:
        NGROK_PORT: ${NGROK_PORT}
    container_name: ${HOST_USERNAME}-ngrok-api-container
    image: g6-ngrok-api:latest
    ports:
      # - "127.0.0.1:${NGROK_PORT}:${NGROK_PORT}"
      - "${NGROK_PORT}:${NGROK_PORT}"

    # GPU support (using runtime for compatibility)
    runtime: nvidia

    # Environment variables
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # CUDA_VISIBLE_DEVICES will be set automatically by docker-entrypoint.sh
      # based on GPU with highest available memory
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/home/root:/home/root/api

      # HuggingFace cache
      - HF_HOME=/home/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/root/.cache/huggingface

      # Paths de modelos (como en tu compose original)
      - SFT_MODEL_PATH=/home/root/weights/sft_lora/best_checkpoint # ???
      - FINAL_MODEL_PATH=/home/root/weights/final_rlm_lora/best_checkpoint

      # Lib path (como tu base)
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda-12.8/lib64:/usr/lib/x86_64-linux-gnu

    # Working directory
    working_dir: /home/root

    # Volúmenes (unificados)
    volumes:
      - ${REPO_PATH}/pyproject.toml:/home/root/pyproject.toml
      # - ${REPO_PATH}/api/app.py:/home/root/api/app.py
      # - ${REPO_PATH}/api/cache_model_assets.py:/home/root/api/cache_model_assets.py
      - ${REPO_PATH}/api:/home/root/api
      - ${REPO_PATH}/rlm:/home/root/rlm
      - ${REPO_PATH}/tool_use:/home/root/tool_use
      - ${REPO_PATH}/react:/home/root/react
      - ${REPO_PATH}/rag:/home/root/rag
      - ${REPO_PATH}/weights:/home/root/weights
      - ${REPO_PATH}/utils:/home/root/utils

      - ${REAL_HF_CACHE}:/home/root/.cache/huggingface

      # - ${REPO_PATH}/web/public:/home/root/web/public
      - ${REPO_PATH}/web:/home/root/web

      # - /:/home/root/admin


    # Keep container running
    stdin_open: true
    tty: true

    command: bash  # TODO: RESTORE THIS

    # Network mode
    network_mode: bridge

    # Restart policy
    restart: unless-stopped
