unbind -a -T prefix
unbind -a -T root

# --- General ---
set -g xterm-keys on
set -g set-clipboard on
set -g escape-time 100
set -g status-interval 10
# set -g detach-on-destroy off  # tmux sessions to die automatically when you close the terminal,

# --- Display ---
# set -g default-terminal "tmux-256color"
# set -as terminal-features '*:RGB'          # optional but nice
# for image display
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- Prefix ---
unbind C-b
set -g prefix C-F1  # Ctrl + space

# --- Session ---
bind _ detach
bind -n M-F2 detach  # alt + .
bind C-_ confirm-before -p "Kill session #{session_name}? (y/n)" "kill-session"
unbind r  # reload session ?? (or window?)
bind l if-shell "test -n \"$TMUX_CONF\"" \
  "source-file \"$TMUX_CONF\"; display-message 'tmux config reloaded'" \
  "source-file ~/.config/tmux/tmux.conf; display-message 'tmux config reloaded'"
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
set-hook -g session-created 'run-shell -b "
  name=#{session_name};
  stored=\$(tmux show-options -gqv @stored_sessions);
  case ,\${stored}, in
    *,\${name},*) exit 0 ;;            # (1) session already stored
  esac
  case \${name} in
    /tmp/tmp-*) exit 0 ;;              # (2) session name is a tmp launcher
  esac
  sleep 0.15;
  tmux command-prompt -p \"name session:\" \"rename-session -- %%\";
"'

# --- Help ---
bind-key -T prefix '?' display-popup -w 140 -h 20 -x C -y C \
  -E 'sh -lc "/usr/bin/tmux -L \"#{socket_name}\" list-keys 2>&1 | { command -v less >/dev/null 2>&1 && less -R || cat; }"'

# --- Panes ---
bind -n M-h split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-- resize-pane -L 5
bind -n M-+ resize-pane -R 5
bind -n M-Left  if-shell -F '#{pane_at_left}'   'select-pane -R' 'select-pane -L'
bind -n M-Right if-shell -F '#{pane_at_right}'  'select-pane -L' 'select-pane -R'
bind -n M-Up    if-shell -F '#{pane_at_top}'    'select-pane -D' 'select-pane -U'
bind -n M-Down  if-shell -F '#{pane_at_bottom}' 'select-pane -U' 'select-pane -D'

# --- Windows ---
bind n new-window -c "#{pane_current_path}"
bind w kill-window
bind -n M-F1 next-window  # alt + space
bind -n C-M-F1 previous-window # alt + shift + space

# --- Mouse ---
bind -n M-m set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# --- Scroll ---
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# --- Copy / Paste ---
# 1 Start selection with a mouse drag
# When you drag with button 1 in the root table, enter copy-mode (if needed) and begin a selection.
bind -T root MouseDrag1Pane \
  if -F "#{pane_in_mode}" \
    "send -X begin-selection" \
    "copy-mode -e; send -X begin-selection"
# 2 On mouse release, copy selection to Windows clipboard and exit copy-mode WSL: use Windows clip.exe (from System32) to populate the Windows clipboard
bind -T copy-mode-vi MouseDragEnd1Pane \
  send -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
# 3. Paste (Windows clipboard -> tmux, NO trailing Enter)
bind -T root MouseDown3Pane \
  run-shell "(/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\r' | python3 -c 'import sys; data = sys.stdin.read(); sys.stdout.write(data.rstrip(\"\\n\"))') | tmux load-buffer -" \; \
  paste-buffer
bind -T root C-MouseDown3Pane \
  run-shell "(/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\r' | python3 -c 'import sys; data = sys.stdin.read(); sys.stdout.write(data.rstrip(\"\\n\"))') | tmux load-buffer -" \; \
  paste-buffer


# --- Command Mode ---
bind : command-prompt

# --- Copy Mode ---
bind v copy-mode \; display-message 'entered copy mode'
bind -T copy-mode-vi q send-keys -X cancel \; display-message 'exited copy mode'
bind -T copy-mode q send-keys -X cancel \; display-message 'exited copy mode'
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel \; display-message 'exited copy mode'
bind -T copy-mode Enter send-keys -X copy-selection-and-cancel \; display-message 'exited copy mode'


# --- Hooks ---

# Start every pane/window with a clean env, POSIX-safe
set -g default-command 'sh -c "
  ve=\${VIRTUAL_ENV-}
  cp=\${CONDA_PREFIX-}

  # drop stale env vars
  unset VIRTUAL_ENV VIRTUAL_ENV_PROMPT CONDA_PREFIX CONDA_DEFAULT_ENV MAMBA_DEFAULT_ENV \
        PYTHONHOME PYTHONPATH UV_ACTIVE UV_PROJECT UV_PYTHON PIXI_PREFIX PIXI_ENV

  # rebuild PATH without env-specific bins
  oldpath=\$PATH
  newpath=

  IFS=:
  set -f
  for d in \$oldpath; do
    skip=0
    if [ -n \"\$ve\" ] && [ \"\$d\" = \"\$ve/bin\" ]; then skip=1; fi
    if [ -n \"\$cp\" ] && [ \"\$d\" = \"\$cp/bin\" ]; then skip=1; fi
    case \"\$d\" in
      */.venv/bin) skip=1 ;;
    esac
    if [ \$skip -eq 0 ]; then
      if [ -n \"\$newpath\" ]; then newpath=\$newpath:\$d; else newpath=\$d; fi
    fi
  done
  unset IFS
  set +f
  export PATH=\$newpath

  exec \"\$SHELL\" -l
"'


set -g @hook_session_created__rename_prompt '
  name=#{session_name}
  stored=$(tmux show-options -gqv @stored_sessions)

  # tmux display-message "HOOK DEBUG: name=\"$name\" stored=\"$stored\""

  # (1) skip if already stored
  case ",${stored}," in
    *,"${name}",*)
      tmux display-message "HOOK DEBUG: skipping rename (already stored)"
      exit 0
      ;;
  esac

  # (2) skip tmp launcher sessions
  case "${name}" in
    /tmp/tmp-*)
      tmux display-message "HOOK DEBUG: skipping rename (tmp session)"
      exit 0
      ;;
  esac

  # tmux display-message "HOOK DEBUG: launching rename prompt for $name"

  sleep 0.25
  tmux command-prompt -p "name session:" "rename-session -- %%"
'


# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @session-wizard 's'

# --- TPM init (MUST be last) ---
run ~/.tmux/plugins/tpm/tpm
# run '~/repositories/tmux-session-wizard.tmux'

# --- Custom Utiilites ---
run-shell -b '~/.config/tmux/utils/custom-status/custom-status.sh'


